services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    restart: unless-stopped

  app-blue:
    image: ghcr.io/fiqast/fastapi-cicd-pipeline:latest
    restart: unless-stopped

  app-green:
    image: ghcr.io/fiqast/fastapi-cicd-pipeline:latest
    restart: unless-stopped
