name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fastapi-cicd-pipeline:ci .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            fastapi-cicd-pipeline:ci

  loadtest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and start app
        run: |
          docker build -t fastapi-cicd-pipeline:ci .
          docker run -d --name app -p 8000:8000 fastapi-cicd-pipeline:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done

      - name: Run load test
        run: |
          pip install locust
          locust -f loadtest/locustfile.py --headless \
            -u 20 -r 5 -t 20s \
            --host http://localhost:8000

      - name: Stop app
        if: always()
        run: docker rm -f app

  publish:
    runs-on: ubuntu-latest
    needs: loadtest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/fiqast/fastapi-cicd-pipeline:latest
            ghcr.io/fiqast/fastapi-cicd-pipeline:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Deploy (blue-green)
        shell: powershell
        run: ./deploy.ps1

      - name: Health check
        shell: powershell
        run: Invoke-RestMethod http://localhost:8080/health